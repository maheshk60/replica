<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="15"
                    flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F1F5F9"/>

  <!-- Left gradient panel -->
  <path d="M0 0 H600 L450 900 H0 Z" fill="url(#mainGrad)">
    <animate attributeName="d"
             values="M0 0 H600 L450 900 H0 Z;
                     M0 0 H650 L500 900 H0 Z;
                     M0 0 H600 L450 900 H0 Z"
             dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Soft glow -->
  <circle cx="550" cy="200" r="150" fill="#6366F1" opacity="0.3">
    <animate attributeName="r" values="150;170;150" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= BLOCK 1: HR SOLUTION ================= -->
  <g transform="translate(100, 140)" filter="url(#softShadow)">
    <circle cx="40" cy="40" r="40" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2"/>
    <circle cx="40" cy="30" r="12" fill="white"/>
    <path d="M20 60 Q40 45 60 60" stroke="white" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <text x="-10" y="100" font-family="Arial" font-size="14"
          font-weight="bold" fill="white">HR SOLUTION</text>

    <animateTransform attributeName="transform" type="translate"
                      values="100,140; 80,140; 100,140"
                      keyTimes="0; 0.5; 1"
                      dur="7s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- ================= BLOCK 2: CLIENT MANAGEMENT ================= -->
  <g transform="translate(320, 260)" filter="url(#softShadow)">
    <circle cx="40" cy="40" r="40" fill="white" fill-opacity="0.2"
            stroke="white" stroke-width="2"/>
    <circle cx="40" cy="28" r="10" fill="white"/>
    <circle cx="18" cy="38" r="6" fill="white" opacity="0.8"/>
    <circle cx="62" cy="38" r="6" fill="white" opacity="0.8"/>
    <path d="M22 52 Q40 38 58 52" stroke="white" stroke-width="4"
          fill="none" stroke-linecap="round"/>

    <text x="-35" y="100" font-family="Arial" font-size="14"
          font-weight="bold" fill="white">CLIENT MANAGEMENT</text>

    <animateTransform attributeName="transform" type="translate"
                      values="320,260; 300,260; 320,260"
                      keyTimes="0; 0.5; 1"
                      dur="8s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- ================= BLOCK 3: COMPLIANCE ================= -->
  <g transform="translate(100, 380)" filter="url(#softShadow)">
    <path d="M0 10 L40 0 L80 10 V40
             C80 65 40 85 40 85
             C40 85 0 65 0 40 Z"
          fill="url(#accentGrad)"/>
    <path d="M25 40 L35 50 L55 30"
          stroke="white" stroke-width="6"
          fill="none" stroke-linecap="round"
          stroke-linejoin="round"/>

    <text x="-40" y="110" font-family="Arial" font-size="14"
          font-weight="bold" fill="white">COMPLIANCE SECURE</text>

    <animateTransform attributeName="transform" type="translate"
                      values="100,380; 80,380; 100,380"
                      keyTimes="0; 0.5; 1"
                      dur="7s" repeatCount="indefinite" 
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- ================= BLOCK 4: SMART INVOICING ================= -->
  <g transform="translate(320, 520)" filter="url(#softShadow)">
    <rect width="70" height="90" rx="10" fill="white"/>
    <rect x="15" y="20" width="40" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="15" y="35" width="40" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="15" y="50" width="25" height="5" rx="2" fill="#4338CA"/>

    <text x="-30" y="115" font-family="Arial" font-size="14"
          font-weight="bold" fill="white">SMART INVOICING</text>

    <animateTransform attributeName="transform" type="translate"
                      values="320,520; 290,520; 320,520"
                      keyTimes="0; 0.5; 1"
                      dur="8s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- ================= BLOCK 5: MAIL AUTOMATION ================= -->
  <g transform="translate(100, 660)" filter="url(#softShadow)">
    <rect x="0" y="10" width="80" height="55" rx="8" fill="white"/>
    <path d="M0 10 L40 40 L80 10" fill="#E5E7EB"/>
    <path d="M0 65 L40 35 L80 65" fill="#CBD5E1"/>
    <circle cx="70" cy="15" r="6" fill="#EF4444"/>

    <text x="-30" y="95" font-family="Arial" font-size="14"
          font-weight="bold" fill="white">MAIL AUTOMATION</text>

    <animateTransform attributeName="transform" type="translate"
                      values="100,660; 80,660; 100,660"
                      keyTimes="0; 0.5; 1"
                      dur="6s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </g>

  <!-- Right dots -->
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#94A3B8" opacity="0.3"/>
  </pattern>
  <rect x="700" y="0" width="740" height="900" fill="url(#dots)"/>

</svg>
